####
# Segmentation decoder: SE global context + conv-before-upsample body (dense convs run
# at the lower resolution) + a narrow full-res spatial conv that keeps field lines crisp.
####

[route]
layers=18

# Inject a global scene descriptor into every location FIRST (adds image-level context),
# then reweight channels with a normal (channel) SE.
[globalcontext]
ctx_channels=64

[se]
reduction=8

# --- /16 -> /8 : conv runs BEFORE the upsample (at the lower resolution) ---
[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers=-1, 10

# Channel SE to reweight the fused (semantic + high-res skip) channels
[se]
reduction=8

# --- /8 -> /4 ---
[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers=-1, 2

# Channel SE to reweight the fused (semantic + high-res skip) channels
[se]
reduction=8

# --- /4 -> /2 ---
[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[upsample]
stride=2

[route]
layers=-1, 0

# Channel SE to reweight the fused (semantic + high-res skip) channels
[se]
reduction=8

# --- /2 -> /1 : upsample, then a narrow full-res spatial conv to reconstruct thin lines ---
[upsample]
stride=2

[convolutional]
batch_normalize=1
filters=16
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=3
size=1
stride=1
pad=1
activation=linear

[seg]
classes=3

